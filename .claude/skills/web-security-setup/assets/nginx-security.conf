# Nginx — vlož do server bloku, nebo ulož jako
# /etc/nginx/snippets/security.conf a includuj.
#
# Test před nasazením:  nginx -t && systemctl reload nginx

# ---------------------------------------------------------------
# Přesměrování http -> https
# ---------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    root /var/www/example.com/public;
    index index.html;

    # -----------------------------------------------------------
    # TLS
    # -----------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/example.com/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # -----------------------------------------------------------
    # Bezpečnostní hlavičky
    # "always" je důležité, jinak se hlavičky nepřidají k 4xx/5xx
    # -----------------------------------------------------------
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Skrytí verze nginxu (server_tokens patří i do http bloku)
    server_tokens off;

    # -----------------------------------------------------------
    # Blokace citlivých cest
    # -----------------------------------------------------------
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location ~* \.(env|log|sql|bak|old|orig|ini|yml|yaml|lock|sh)$ {
        deny all;
        return 404;
    }

    # Zákaz výpisu adresářů
    autoindex off;

    # -----------------------------------------------------------
    # Rate limiting (definice zóny patří do http bloku:
    #   limit_req_zone $binary_remote_addr zone=general:10m rate=30r/m;
    #   limit_req_zone $binary_remote_addr zone=forms:10m rate=5r/m;
    # )
    # -----------------------------------------------------------
    limit_req zone=general burst=20 nodelay;

    location /api/kontakt {
        limit_req zone=forms burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Limit velikosti uploadu
    client_max_body_size 5m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # -----------------------------------------------------------
    # Cache
    # -----------------------------------------------------------
    location ~* \.(?:css|js|woff2|png|jpe?g|webp|avif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
