# Apache — přejmenuj na .htaccess a nahraj do kořene webu.
# Vyžaduje mod_headers, mod_rewrite, mod_deflate.
# U českých sdílených hostingů (Wedos, Forpsi, Active24) tohle funguje.

# ---------------------------------------------------------------
# 1. Vynucení HTTPS a kanonické domény
# ---------------------------------------------------------------
<IfModule mod_rewrite.c>
  RewriteEngine On

  # http -> https
  RewriteCond %{HTTPS} !=on
  RewriteCond %{HTTP:X-Forwarded-Proto} !https
  RewriteRule ^(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]

  # www -> bez www (nebo obráceně, podle toho co je kanonické)
  RewriteCond %{HTTP_HOST} ^www\.(.+)$ [NC]
  RewriteRule ^(.*)$ https://%1/$1 [R=301,L]

  # Blokace přístupu k citlivým souborům
  RewriteRule ^\.env - [F,L]
  RewriteRule ^\.git - [F,L]
  RewriteRule \.(sql|bak|log|ini|sh|yml|yaml|lock)$ - [F,L]
</IfModule>

# ---------------------------------------------------------------
# 2. Bezpečnostní hlavičky
# ---------------------------------------------------------------
<IfModule mod_headers.c>
  Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; upgrade-insecure-requests"

  Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains" env=HTTPS
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "DENY"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()"
  Header always set Cross-Origin-Opener-Policy "same-origin"
  Header always set Cross-Origin-Resource-Policy "same-origin"
  Header always set X-XSS-Protection "0"
  Header always set X-Permitted-Cross-Domain-Policies "none"

  # Neprozrazovat technologie
  Header always unset X-Powered-By
  Header always unset Server
  Header always unset X-AspNet-Version
</IfModule>

# PHP verzi taky pryč
<IfModule mod_php.c>
  php_flag expose_php off
</IfModule>
ServerSignature Off

# ---------------------------------------------------------------
# 3. Zákaz výpisu adresářů
# ---------------------------------------------------------------
Options -Indexes -MultiViews

# ---------------------------------------------------------------
# 4. Blokace citlivých souborů (druhá vrstva k RewriteRule výše)
# ---------------------------------------------------------------
<FilesMatch "^\.|\.(env|log|sql|bak|old|orig|save|swp|dist|ini|json|lock|yml|yaml|sh|md)$">
  Require all denied
</FilesMatch>

<Files "composer.json">
  Require all denied
</Files>
<Files "package.json">
  Require all denied
</Files>
<Files "wp-config.php">
  Require all denied
</Files>

# ---------------------------------------------------------------
# 5. Správné MIME typy (nutné, aby nosniff nerozbil web)
# ---------------------------------------------------------------
<IfModule mod_mime.c>
  AddType text/css .css
  AddType application/javascript .js
  AddType image/svg+xml .svg
  AddType font/woff2 .woff2
  AddType image/webp .webp
  AddType image/avif .avif
</IfModule>

# ---------------------------------------------------------------
# 6. Cache
# ---------------------------------------------------------------
<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresByType text/css "access plus 1 year"
  ExpiresByType application/javascript "access plus 1 year"
  ExpiresByType image/webp "access plus 1 year"
  ExpiresByType font/woff2 "access plus 1 year"
  ExpiresByType text/html "access plus 0 seconds"
</IfModule>
