# VIZEON Security workflow → .github/workflows/security.yml
# DŮLEŽITÉ: před použitím připni všechny akce na commit SHA (např. actions/checkout@<40 znaků SHA> # v4.x)
# a nastav tento workflow jako povinný status check v branch protection / ruleset pro main.

name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'   # týdně i bez změn – nové CVE v závislostech

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # PIN TO SHA
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --verbose --exit-code 1

  test:
    name: Lint, typecheck, testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # PIN TO SHA
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4         # PIN TO SHA
      - uses: actions/setup-node@v4        # PIN TO SHA
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test -- --run
      - name: VIZEON sec-scan
        run: bash tools/security/sec-scan.sh --ci

  database:
    name: RLS testy + DB audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # PIN TO SHA
        with: { persist-credentials: false }
      - uses: supabase/setup-cli@v1        # PIN TO SHA
        with: { version: latest }
      - run: supabase start
      - run: supabase db lint --level error
      - run: supabase test db              # pgTAP testy v supabase/tests
      - name: VIZEON audit gate
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          bash tools/security/audit-gate.sh \
            tools/security/audit.sql \
            docs/security/audit-allowlist.txt

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4          # PIN TO SHA
        with: { persist-credentials: false }
      - run: semgrep scan --error --config p/nextjs --config p/typescript --config p/react --config p/secrets --config p/owasp-top-ten

  sca:
    name: Závislosti (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # PIN TO SHA
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4         # PIN TO SHA
      - uses: actions/setup-node@v4        # PIN TO SHA
        with: { node-version: 22 }
      - run: pnpm audit --prod --audit-level high
      - uses: google/osv-scanner-action/osv-scanner-action@v2   # PIN TO SHA
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4          # PIN TO SHA
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@v3      # PIN TO SHA
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3   # PIN TO SHA
