# → .github/dependabot.yml
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Bezpečnostní aktualizace přicházejí mimo plán automaticky (Dependabot security updates).
    # Major verze vždy samostatný PR s review.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
